<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NQMFESTFGQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-NQMFESTFGQ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芝しごと・散布予報ナビ - Spray Forecast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>芝しごと・散布予報ナビ</h1>
            <p class="subtitle">気象予測から農薬・肥料散布タイミングをアドバイス</p>
        </header>

        <div class="location-input">
            <h2>場所を設定</h2>
            <div class="input-group">
                <label for="lat">緯度 (Latitude):</label>
                <input type="number" id="lat" step="0.0001" value="35.5" placeholder="例: 35.5">
                
                <label for="lon">経度 (Longitude):</label>
                <input type="number" id="lon" step="0.0001" value="139.6" placeholder="例: 139.6">
            </div>
            <p class="help-text">※緯度・経度はGoogleマップなどで確認できます。<br>地図上で右クリック → 「座標をコピー」で取得できます。</p>
            <div class="button-group">
                <button id="current-location-btn" onclick="getCurrentLocation()" class="secondary">現在地を取得</button>
                <button id="save-btn" onclick="saveAndReload()" class="secondary">設定を保存</button>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>気象データを取得中...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="results" class="results hidden">
            <h2>散布可能タイミング</h2>
            <div id="forecast-table" class="forecast-table-container"></div>
        </div>

        <div class="legend">
            <h3>凡例</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="status-badge green">GREEN</span>
                    <span>散布推奨 - 条件良好</span>
                </div>
                <div class="legend-item">
                    <span class="status-badge yellow">YELLOW</span>
                    <span>注意 - 条件に注意が必要</span>
                </div>
                <div class="legend-item">
                    <span class="status-badge red">RED</span>
                    <span>非推奨 - 散布を避ける</span>
                </div>
            </div>
        </div>

        <footer>
            <p>気象データ提供: <a href="https://www.met.no/" target="_blank">MET Norway</a></p>
            <p>推奨散布時間帯: 早朝 4-7時、夕方 16-19時</p>
            <p><a href="https://www.turf-tools.jp/" target="_blank">グロウアンドプログレス</a></p>
        </footer>
    </div>

    <script>
        // Cookie操作関数
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // 緯度・経度をCookieに保存
        function saveLocation(lat, lon) {
            setCookie('forecast_lat', lat, 30);
            setCookie('forecast_lon', lon, 30);
        }

        // Cookieから緯度・経度を読み込み
        function loadLocation() {
            const lat = getCookie('forecast_lat');
            const lon = getCookie('forecast_lon');
            if (lat && lon) {
                document.getElementById('lat').value = lat;
                document.getElementById('lon').value = lon;
                return { lat: parseFloat(lat), lon: parseFloat(lon) };
            }
            return null;
        }

        // debounce関数
        let debounceTimer;
        function debounce(func, delay) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(func, delay);
        }

        async function fetchForecast() {
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;
            
            if (!lat || !lon) {
                showError('緯度と経度を入力してください');
                return;
            }

            // Cookieに保存
            saveLocation(lat, lon);

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const response = await fetch(`/api/forecast?lat=${lat}&lon=${lon}`);
                const data = await response.json();

                if (data.success) {
                    displayResults(data.results);
                } else {
                    showError(data.error || '予報の取得に失敗しました');
                }
            } catch (error) {
                showError('エラーが発生しました: ' + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function displayResults(results) {
            const container = document.getElementById('forecast-table');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = '<p class="no-results">該当するタイミングが見つかりませんでした。</p>';
                document.getElementById('results').classList.remove('hidden');
                return;
            }

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            // 時間帯の定義（1日のすべての時間帯を表示）
            // 散布可能時間帯: 早朝4-7時、夕方16-19時
            const timeSlots = [];
            // 早朝: 4:00～7:00
            for (let h = 4; h <= 7; h++) {
                timeSlots.push({ hour: h, label: `${h}:00` });
            }
            // 午前: 8:00～15:00
            for (let h = 8; h <= 15; h++) {
                timeSlots.push({ hour: h, label: `${h}:00` });
            }
            // 夕方: 16:00～19:00
            for (let h = 16; h <= 19; h++) {
                timeSlots.push({ hour: h, label: `${h}:00` });
            }
            // 夜: 20:00～23:00
            for (let h = 20; h <= 23; h++) {
                timeSlots.push({ hour: h, label: `${h}:00` });
            }

            // 日付の配列（今日から3日間）
            const dates = [];
            const dayLabels = ['今日', '明日', '明後日'];
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            for (let i = 0; i < 3; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() + i);
                const weekday = weekdays[date.getDay()];
                dates.push({
                    date: date,
                    label: dayLabels[i],
                    dateStr: date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) + `(${weekday})`
                });
            }

            // resultsを日付と時間でマップに変換
            // APIから返される時刻はJST（backendで変換済み）として扱う
            const resultMap = new Map();
            const dateSet = new Set();  // デバッグ用：データがある日付を記録
            results.forEach(result => {
                const dt = new Date(result.time);  // JST時刻（タイムゾーン情報付き）
                // ローカル日付と時刻を取得（JST）
                const year = dt.getFullYear();
                const month = dt.getMonth();
                const date = dt.getDate();
                const hour = dt.getHours();  // ローカル時刻の時間（JST）
                
                // 日付キー（日付のみ）- YYYY-MM-DD形式で統一（ローカル日付）
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                dateSet.add(dateKey);  // デバッグ用
                // マップキーは日付_時間の形式（ローカル時刻の時間を使用）
                const mapKey = `${dateKey}_${hour}`;
                resultMap.set(mapKey, result);
            });
            
            // デバッグ: データがある日付を確認
            console.log('Dates with data:', Array.from(dateSet).sort());
            console.log('Expected dates:', dates.map(d => {
                const year = d.date.getFullYear();
                const month = d.date.getMonth();
                const date = d.date.getDate();
                return `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
            }));

            // 表の作成
            let tableHTML = '<table class="forecast-table"><thead><tr><th class="time-header">時間</th>';
            dates.forEach(d => {
                tableHTML += `<th class="date-header">${d.label}<br><span class="date-sub">${d.dateStr}</span></th>`;
            });
            tableHTML += '</tr></thead><tbody>';

            timeSlots.forEach(timeSlot => {
                tableHTML += '<tr>';
                tableHTML += `<td class="time-cell">${timeSlot.label}</td>`;
                
                dates.forEach(dateInfo => {
                    const slotDate = new Date(dateInfo.date);
                    slotDate.setHours(timeSlot.hour, 0, 0, 0);
                    
                    // 過去かどうか判定
                    const isPast = slotDate < now;
                    
                    // 日付キーを生成（年月日のみ）- YYYY-MM-DD形式で統一（ローカル日付）
                    const year = slotDate.getFullYear();
                    const month = slotDate.getMonth();
                    const date = slotDate.getDate();
                    const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                    // 検索キーもローカル時刻の時間を使用
                    const mapKey = `${dateKey}_${timeSlot.hour}`;
                    
                    const result = resultMap.get(mapKey);
                    
                    // 散布可能時間帯かどうかを判定（resultから取得、なければフロントエンドで判定）
                    const isSprayTime = result ? (result.is_spray_time !== false) : ((timeSlot.hour >= 4 && timeSlot.hour < 7) || (timeSlot.hour >= 16 && timeSlot.hour < 19));
                    
                    if (isPast) {
                        // 過去の場合はグレー表示
                        tableHTML += `<td class="forecast-cell past-cell">-</td>`;
                    } else if (result) {
                        // データがある場合
                        const statusClass = result.status.toLowerCase();
                        const hasWarnings = result.warnings && result.warnings.length > 0;
                        const hasRecommendations = result.recommendations && result.recommendations.length > 0;
                        const hasReasons = result.reason && result.reason.length > 0;
                        
                        // 天気アイコンのマッピング
                        const weatherIcons = {
                            "晴れ": "☀️",
                            "くもり": "☁️",
                            "弱い雨": "🌦️",
                            "雨強め": "🌧️"
                        };
                        const weatherIcon = weatherIcons[result.condition] || "☁️";
                        
                        let cellContent = `
                            <div class="cell-content status-${statusClass} ${!isSprayTime ? 'not-spray-time-content' : ''}">
                                ${!isSprayTime ? '<div class="spray-time-label">散布時間帯外</div>' : ''}
                                <div class="cell-weather-icon">
                                    <span class="weather-icon">${weatherIcon}</span>
                                    <span class="weather-condition">${result.condition}</span>
                                </div>
                                <div class="cell-weather">
                                    <div class="weather-item">風: ${result.wind.toFixed(1)}m/s</div>
                                    <div class="weather-item">気温: ${result.temp.toFixed(1)}°C</div>
                                    <div class="weather-item">降水: ${result.precip.toFixed(2)}mm</div>
                                </div>
                        `;
                        
                        if (hasReasons) {
                            cellContent += `<div class="cell-reason">${result.reason.join(', ')}</div>`;
                        }
                        
                        if (hasWarnings) {
                            result.warnings.forEach(warning => {
                                cellContent += `<div class="cell-warning">⚠️ ${warning}</div>`;
                            });
                        }
                        
                        if (hasRecommendations) {
                            result.recommendations.forEach(recommendation => {
                                cellContent += `<div class="cell-recommendation">💡 ${recommendation}</div>`;
                            });
                        }
                        
                        if (!hasReasons && !hasWarnings && !hasRecommendations && isSprayTime) {
                            cellContent += `<div class="cell-ok">✓ 条件良好</div>`;
                        }
                        
                        cellContent += `</div>`;
                        
                        tableHTML += `<td class="forecast-cell" data-status="${statusClass}">${cellContent}</td>`;
                    } else {
                        // データがない場合
                        if (isSprayTime) {
                            // 散布可能時間帯だがデータがない（未来の時間帯など）
                            tableHTML += `<td class="forecast-cell empty-cell">-</td>`;
                        } else {
                            // 散布可能時間帯外
                            tableHTML += `<td class="forecast-cell not-spray-time">散布時間帯外</td>`;
                        }
                    }
                });
                
                tableHTML += '</tr>';
            });

            tableHTML += '</tbody></table>';
            container.innerHTML = tableHTML;
            
            document.getElementById('results').classList.remove('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                showError('このブラウザは位置情報をサポートしていません');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(4);
                    const lon = position.coords.longitude.toFixed(4);
                    document.getElementById('lat').value = lat;
                    document.getElementById('lon').value = lon;
                    document.getElementById('loading').classList.add('hidden');
                },
                (error) => {
                    document.getElementById('loading').classList.add('hidden');
                    showError('位置情報の取得に失敗しました: ' + error.message);
                }
            );
        }

        function saveAndReload() {
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;
            
            if (!lat || !lon) {
                showError('緯度と経度を入力してください');
                return;
            }

            // Cookieに保存
            saveLocation(lat, lon);
            
            // リロード
            location.reload();
        }

        // ページ読み込み時にCookieから値を読み込んで自動取得
        window.addEventListener('DOMContentLoaded', () => {
            const savedLocation = loadLocation();
            if (savedLocation) {
                // Cookieから読み込んだ値で自動取得
                fetchForecast();
            }
        });
    </script>
</body>
</html>
